<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MAF Dashboard</title>
<style>
:root{--navy:#1d3557; --navy-dark:#14253d; --link:#1f5fae; --ink:#1f1e1c; --muted:#5e5b55; --wash:#f4f3ef; --line:#dcd8cf; --panel:#fff}
@media (prefers-color-scheme: dark){:root{--navy:#8fb0dd; --navy-dark:#b7cdee; --link:#8ab8f0; --ink:#ecebe7; --muted:#a5a29b; --wash:#191917; --line:#3a3936; --panel:#242422}}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--wash); color:var(--ink); font:17px/1.5 system-ui, 'Segoe UI', Arial, sans-serif}
form{width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line); border-top:6px solid var(--navy); border-radius:6px; padding:28px}
h1{font-family:Georgia, 'Times New Roman', serif; font-weight:400; color:var(--navy-dark); font-size:26px; line-height:1.2; margin:0 0 6px}
p{margin:0 0 16px; color:var(--muted); font-size:15px}
label{display:block; font-weight:600; margin:0 0 6px}
input{width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--ink)}
input:focus-visible, button:focus-visible{outline:3px solid var(--link); outline-offset:2px}
button{margin-top:14px; background:var(--navy); color:#fff; border:0; border-radius:4px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer}
@media (prefers-color-scheme: dark){button{color:#14253d}}
button[disabled]{opacity:.6; cursor:wait}
.msg{margin:12px 0 0; color:#b42828; font-weight:600}
</style>
</head>
<body>
<form id="unlock">
  <h1>MAF Committee Dashboard</h1>
  <p>LCMS Ministry to the Armed Forces. For committee members and MAF staff. Enter the password to open it.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">Open</button>
  <div class="msg" id="msg" role="alert" hidden></div>
</form>

<script>
(function(){
  var form = document.getElementById('unlock'), msg = document.getElementById('msg'), go = document.getElementById('go');
  function say(t){ msg.textContent = t; msg.hidden = !t; }
  if (!window.crypto || !crypto.subtle) { say('This browser cannot open the page. Try a current version of Chrome, Edge, Safari or Firefox.'); go.disabled = true; return; }
  form.addEventListener('submit', async function(ev){
    ev.preventDefault(); say(''); go.disabled = true; go.textContent = 'Openingâ¦';
    try {
      var raw = atob(document.getElementById('payload').textContent.trim());
      var bytes = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      var salt = bytes.slice(8, 16), data = bytes.slice(16);
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value.trim()), 'PBKDF2', false, ['deriveBits']);
      var bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:salt, iterations:600000}, base, 384));
      var key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
      var html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC', iv:bits.slice(32, 48)}, key, data));
      if (html.slice(0, 15).toLowerCase() !== '<!doctype html>') throw new Error('wrong');
      document.open(); document.write(html); document.close();
    } catch (e) {
      say('That password is not right. Please try again.');
      go.disabled = false; go.textContent = 'Open';
      document.getElementById('pw').select();
    }
  });
})();
</script>
